name: Validate PR on develop branch

on:
  pull_request:
    types: [opened, synchronize]
    branches: [develop]
    paths:
      - 'force-app/**'

jobs:
  validate-deployment-on-integration-org:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Check Node.js version
        run: node -v

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI and plugins
        run: |
          npm install --global @salesforce/cli
          sf --version
          echo y | sf plugins install sfdx-git-delta

      - name: Clear cache and install sf scanner plugin
        run: |
          rm -rf ~/.local/share/sfdx
          sf plugins install @salesforce/sfdx-scanner

      - name: Read PR Body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo $PR_BODY > pr_body.txt
          node parsePR.js
          TESTS=$(cat testsToRun.txt)
          echo "APEX_TESTS=$TESTS" >> $GITHUB_ENV

      - name: Populate auth file with SF_URL
        run: echo ${{ secrets.SFDX_INTEGRATION_URL }} > SF_INTEGRATION_URL.txt

      - name: Authenticate to Integration Org
        run: sf auth:sfdxurl:store -f SF_INTEGRATION_URL.txt -s -a integration

      - name: Create delta packages
        run: |
          mkdir changed-sources
          sf sgd:source:delta --to "HEAD" --from "HEAD^" --output changed-sources/ --generate-delta --source force-app/

      - name: Set correct environment variables
        run: |
          echo "SF_LAZY_LOAD_MODULES=true" >> $GITHUB_ENV
          echo "SF_DISABLE_AUTOUPDATE=true" >> $GITHUB_ENV
          echo "SF_AUTOUPDATE_DISABLE=true" >> $GITHUB_ENV

      - name: Scan code
        run: |
          cd changed-sources
          sf scanner:run --format sarif --target './**/*.cls' --category "Design,Best Practices,Performance" --outfile 'apexScanResults.sarif'
          cd ..

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: changed-sources/apexScanResults.sarif

      - name: Deploy delta changes
        run: |
          if [ -z "${{ env.APEX_TESTS }}" ]; then
            result=$(sf deploy metadata -d "changed-sources/force-app" --dry-run --test-level NoTestRun --json);
          elif [ "${{ env.APEX_TESTS }}" == "all" ]; then
            result=$(sf deploy metadata -d "changed-sources/force-app" --dry-run --test-level RunLocalTests --json);
          else
            result=$(sf deploy metadata -d "changed-sources/force-app" --dry-run --test-level RunSpecifiedTests --runtests ${{ env.APEX_TESTS }} --json);
          fi

          echo "Deployment result: $result"

          # Vérification de la couverture de test
          coverage_warning=$(echo "$result" | jq '.result.codeCoverageWarnings[]?.message')
          if [ "$coverage_warning" != "null" ]; then
            echo "::error ::Merging is blocked due to insufficient test coverage."
            echo "Coverage issues: $coverage_warning" >> $GITHUB_ENV
          fi

          # Vérification des erreurs de test (tests échoués)
          test_errors=$(echo "$result" | jq '.result.deploymentStatus' | grep -i "Failed")
          if [ ! -z "$test_errors" ]; then
            echo "::error ::Merging is blocked due to failed tests."
            echo "Please review the failed tests and ensure all tests pass before merging." >> $GITHUB_ENV
          fi

          # Vérification des erreurs de déploiement (problèmes de déploiement)
          deploy_errors=$(echo "$result" | jq '.result.status' | grep -i "Failed")
          if [ ! -z "$deploy_errors" ]; then
            echo "::error ::Merging is blocked due to deployment issues."
            echo "Please review the deployment errors and resolve them before merging." >> $GITHUB_ENV
          fi

            # Si aucune erreur, indiquer que le déploiement est prêt pour la fusion
          if [ -z "$coverage_warning" ] && [ -z "$test_errors" ] && [ -z "$deploy_errors" ]; then
            echo "::notice ::The deployment is successful and ready for merge."
          fi

      - name: Cleanup temporary files
        run: rm -f pr_body.txt testsToRun.txt SF_INTEGRATION_URL.txt
